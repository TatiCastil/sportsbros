<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsBros - Juegos de Deporte Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#15803d;
  --green2:#16a34a;
  --dark:#0f172a;
  --card:#1e293b;
  --border:#334155;
  --text:#e2e8f0;
  --muted:#94a3b8;
}
body{font-family:'Barlow',sans-serif;background:var(--dark);color:var(--text);min-height:100vh}

/* HEADER */
header{
  background:linear-gradient(135deg,#064e3b 0%,#15803d 100%);
  padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  border-bottom:2px solid #22c55e;
}
.logo{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:3px;color:#fff}
.logo span{color:#4ade80}
.logo-sub{font-size:11px;letter-spacing:3px;color:rgba(255,255,255,0.55);margin-top:-4px}
.search{
  display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.15);
  border-radius:10px;padding:9px 14px;flex:1;max-width:280px;
}
.search input{background:none;border:none;outline:none;color:#fff;font-family:'Barlow',sans-serif;font-size:14px;width:100%}
.search input::placeholder{color:rgba(255,255,255,0.3)}
.search svg{width:18px;height:18px;stroke:rgba(255,255,255,0.4);flex-shrink:0}

/* CATEGORIES */
.cats{
  display:flex;gap:8px;padding:14px 24px;
  background:#111827;border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
}
.cats::-webkit-scrollbar{display:none}
.cat{
  padding:7px 18px;border-radius:20px;font-size:13px;font-weight:600;
  cursor:pointer;border:1px solid var(--border);background:var(--card);
  color:var(--muted);white-space:nowrap;transition:all .15s;
}
.cat:hover{border-color:#22c55e;color:#4ade80}
.cat.on{background:#15803d;color:#fff;border-color:#15803d}

/* GRID */
main{padding:24px;max-width:1200px;margin:0 auto}
.section-label{
  font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;
  color:var(--muted);margin-bottom:16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:14px;
}

/* CARD */
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;cursor:pointer;
  transition:transform .15s,border-color .15s;position:relative;
}
.card:hover{transform:translateY(-3px);border-color:#22c55e}
.thumb{
  height:96px;display:flex;align-items:center;justify-content:center;
  font-size:48px;
}
.badge{
  position:absolute;top:8px;right:8px;
  font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;letter-spacing:.5px;
}
.badge-hot{background:#ef4444;color:#fff}
.badge-new{background:#16a34a;color:#fff}
.card-info{padding:10px 12px}
.card-name{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sport{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}

.empty{padding:60px;text-align:center;color:var(--muted);font-size:15px;grid-column:1/-1}

/* COUNT */
.count{font-size:13px;color:var(--muted);margin-bottom:14px}

/* MODAL */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);
  z-index:100;align-items:center;justify-content:center;padding:16px;
}
.overlay.open{display:flex}
.modal{
  background:#1e293b;border:1px solid #334155;border-radius:14px;
  overflow:hidden;width:100%;max-width:920px;
}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;background:linear-gradient(135deg,#064e3b,#15803d);
}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#fff}
.btn-close{
  background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);
  color:#fff;padding:6px 16px;border-radius:8px;cursor:pointer;
  font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;
}
.btn-close:hover{background:rgba(255,255,255,0.22)}
.modal-frame{width:100%;height:520px;border:none;display:block;background:#000}
.modal-note{
  padding:8px 18px;font-size:12px;color:var(--muted);
  background:#111827;text-align:center;
}
.modal-note a{color:#4ade80}

/* FOOTER */
footer{text-align:center;padding:24px;color:var(--muted);font-size:13px;border-top:1px solid var(--border);margin-top:20px}

/* COLORS */
.bb{background:linear-gradient(135deg,#ea580c,#f97316)}
.fut{background:linear-gradient(135deg,#15803d,#22c55e)}
.ten{background:linear-gradient(135deg,#b45309,#f59e0b)}
.box{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.ski{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.bei{background:linear-gradient(135deg,#6d28d9,#8b5cf6)}
.gol{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.bic{background:linear-gradient(135deg,#be185d,#ec4899)}
.sur{background:linear-gradient(135deg,#0369a1,#0ea5e9)}
.wre{background:linear-gradient(135deg,#92400e,#d97706)}
.run{background:linear-gradient(135deg,#3f6212,#84cc16)}
.vol{background:linear-gradient(135deg,#92400e,#f97316)}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">⚽ Sports<span>Bros</span></div>
    <div class="logo-sub">JUEGOS DE DEPORTE · SIN BLOQUEOS · GRATIS</div>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Buscar juego..." id="q" oninput="render()">
  </div>
</header>

<div class="cats">
  <button class="cat on" onclick="setCat('',this)">🏆 Todos</button>
  <button class="cat" onclick="setCat('basket',this)">🏀 Basquetbol</button>
  <button class="cat" onclick="setCat('futbol',this)">⚽ Futbol</button>
  <button class="cat" onclick="setCat('tenis',this)">🎾 Tenis</button>
  <button class="cat" onclick="setCat('box',this)">🥊 Box</button>
  <button class="cat" onclick="setCat('beisbol',this)">⚾ Beisbol</button>
  <button class="cat" onclick="setCat('ski',this)">⛷️ Ski</button>
  <button class="cat" onclick="setCat('otros',this)">🏄 Otros</button>
</div>

<main>
  <div class="section-label">🎮 JUEGOS DISPONIBLES</div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<footer>SportsBros · Juegos de deporte gratis en línea · Hecho con ❤️</footer>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-head">
      <span class="modal-title" id="mtitle">Jugando...</span>
      <button class="btn-close" onclick="closeModal()">✕ Cerrar</button>
    </div>
    <iframe class="modal-frame" id="mframe" src="" allowfullscreen></iframe>
    <div class="modal-note">Si el juego no carga, <a id="mlink" href="#" target="_blank">ábrelo en nueva pestaña</a></div>
  </div>
</div>

<script>
const games=[
  {name:"Basketball Bros",sport:"basket",e:"🏀",c:"bb",url:"https://basketballbros.io",hot:true},
  {name:"Basketball Stars",sport:"basket",e:"🏀",c:"bb",url:"https://www.crazygames.com/game/basketball-stars"},
  {name:"Dunk Bros",sport:"basket",e:"🏀",c:"bb",url:"https://www.crazygames.com/game/dunk-bros"},
  {name:"Basketball Legends",sport:"basket",e:"🏀",c:"bb",url:"https://www.crazygames.com/game/basketball-legends-2020"},
  {name:"Slam Dunk Forever",sport:"basket",e:"🏀",c:"bb",url:"https://www.crazygames.com/game/slam-dunk-forever",newg:true},
  {name:"Hoop Stars",sport:"basket",e:"🏀",c:"bb",url:"https://www.crazygames.com/game/hoop-stars"},

  {name:"Football Bros",sport:"futbol",e:"⚽",c:"fut",url:"https://footballbros.io",hot:true},
  {name:"Soccer Random",sport:"futbol",e:"⚽",c:"fut",url:"https://www.crazygames.com/game/soccer-random"},
  {name:"Head Soccer",sport:"futbol",e:"⚽",c:"fut",url:"https://www.crazygames.com/game/head-soccer"},
  {name:"Football Legends",sport:"futbol",e:"⚽",c:"fut",url:"https://www.crazygames.com/game/football-legends"},
  {name:"Penalty Kick Online",sport:"futbol",e:"🥅",c:"fut",url:"https://www.crazygames.com/game/penalty-kick-online",newg:true},
  {name:"Rocket Soccer Derby",sport:"futbol",e:"⚽",c:"fut",url:"https://www.crazygames.com/game/rocket-soccer-derby"},

  {name:"Tennis Bros",sport:"tenis",e:"🎾",c:"ten",url:"https://www.crazygames.com/game/tennis-bros",hot:true},
  {name:"Tennis Masters",sport:"tenis",e:"🎾",c:"ten",url:"https://www.crazygames.com/game/tennis-masters"},
  {name:"Table Tennis World Tour",sport:"tenis",e:"🏓",c:"ten",url:"https://www.crazygames.com/game/table-tennis-world-tour"},
  {name:"Ping Pong Chaos",sport:"tenis",e:"🏓",c:"ten",url:"https://www.crazygames.com/game/ping-pong-chaos"},

  {name:"Boxing Random",sport:"box",e:"🥊",c:"box",url:"https://www.crazygames.com/game/boxing-random",hot:true},
  {name:"Ragdoll Fighter",sport:"box",e:"🥋",c:"box",url:"https://www.crazygames.com/game/ragdoll-fighter",newg:true},
  {name:"Street Fighter",sport:"box",e:"🥊",c:"box",url:"https://www.crazygames.com/game/street-fighter-flash"},

  {name:"Baseball Bros",sport:"beisbol",e:"⚾",c:"bei",url:"https://baseballbros.io"},
  {name:"Homerun King",sport:"beisbol",e:"⚾",c:"bei",url:"https://www.crazygames.com/game/homerun-king-pro-baseball"},
  {name:"Baseball 9",sport:"beisbol",e:"⚾",c:"bei",url:"https://www.crazygames.com/game/baseball-9",newg:true},

  {name:"Ski Bros",sport:"ski",e:"⛷️",c:"ski",url:"https://www.crazygames.com/game/ski-resort"},
  {name:"Downhill Ski",sport:"ski",e:"🎿",c:"ski",url:"https://www.crazygames.com/game/downhill-ski"},
  {name:"Snowboard Kings",sport:"ski",e:"🏂",c:"ski",url:"https://www.crazygames.com/game/snowboard-kings-2022"},

  {name:"Moto X3M",sport:"otros",e:"🚴",c:"bic",url:"https://www.crazygames.com/game/moto-x3m",hot:true},
  {name:"Surf Riders",sport:"otros",e:"🏄",c:"sur",url:"https://www.crazygames.com/game/surf-riders",newg:true},
  {name:"Golf Orbit",sport:"otros",e:"⛳",c:"gol",url:"https://www.crazygames.com/game/golf-orbit"},
  {name:"Wrestling Random",sport:"otros",e:"🤼",c:"wre",url:"https://www.crazygames.com/game/wrestling-random"},
  {name:"Volleyball Random",sport:"otros",e:"🏐",c:"vol",url:"https://www.crazygames.com/game/volleyball-random"},
  {name:"Olympic Runner",sport:"otros",e:"🏃",c:"run",url:"https://www.crazygames.com/game/olympic-runner",newg:true},
];

let cat='';

function setCat(c,btn){
  cat=c;
  document.querySelectorAll('.cat').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  let list=games;
  if(cat) list=list.filter(g=>g.sport===cat);
  if(q) list=list.filter(g=>g.name.toLowerCase().includes(q));
  const grid=document.getElementById('grid');
  document.getElementById('count').textContent=list.length+' juegos encontrados';
  if(!list.length){grid.innerHTML='<div class="empty">No se encontraron juegos 😔</div>';return;}
  grid.innerHTML=list.map(g=>`
    <div class="card" onclick="openGame('${g.name}','${g.url}')">
      <div class="thumb ${g.c}">${g.e}${g.hot?'<span class="badge badge-hot">HOT</span>':g.newg?'<span class="badge badge-new">NUEVO</span>':''}</div>
      <div class="card-info">
        <div class="card-name">${g.name}</div>
        <div class="card-sport">${g.sport}</div>
      </div>
    </div>
  `).join('');
}

function openGame(name,url){
  document.getElementById('mtitle').textContent='🎮 '+name;
  document.getElementById('mframe').src=url;
  document.getElementById('mlink').href=url;
  document.getElementById('overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('mframe').src='';
  document.getElementById('overlay').classList.remove('open');
}

function handleOverlayClick(e){
  if(e.target===document.getElementById('overlay')) closeModal();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});

render();
</script>
</body>
</html>
